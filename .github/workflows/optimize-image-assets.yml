name: Optimize festival images

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '**.png'
      - 'scripts/optimize-image-assets.py'
      - '.github/workflows/optimize-image-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-festival-images
  cancel-in-progress: false

jobs:
  optimize:
    # A commit made by this workflow does not need a second optimization run.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            index.html
            *.png
            welcome/*.png
            scripts/optimize-image-assets.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image converter
        run: python -m pip install --upgrade Pillow

      - name: Convert backdrops to WebP
        run: python scripts/optimize-image-assets.py

      - name: Commit optimized assets and updated paths
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add --sparse -A -- '*.webp'
          if git diff --cached --quiet; then
            echo "No image changes were needed."
            exit 0
          fi
          git commit -m "Optimize festival backdrops as WebP [skip ci]"
          git push origin HEAD:main
