name: Audio asset integrity

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'Music/**/*.mp3'
      - 'scripts/check-audio-assets.py'
      - '.github/workflows/audio-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-integrity
  cancel-in-progress: false

jobs:
  validate-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out playlist and audio assets
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            index.html
            Music/**/*.mp3
            scripts/check-audio-assets.py
          sparse-checkout-cone-mode: false

      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Probe metadata and fully decode each track
        run: python3 scripts/check-audio-assets.py
